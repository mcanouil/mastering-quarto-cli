date: today
format:
  html:
    shift-heading-level-by: 1
  coeos-revealjs:
    output-file: slides
    logo: ""
    title-slide-attributes:
      data-background-image: /assets/images/saga.png
      data-background-opacity: "0.35"
    incremental: true
    revealjs-plugins:
      - attribution
    include-in-header:
      - text: |
          <style>
            // .reveal .slides { border: 1px solid #fafafa; }
            .reveal .aside-footnotes {
              font-style: italic;
              font-size: 0.75em;
            }
            iconify-icon {
              display: inline-block;
              width: 1em;
              height: 1em;
            }
          </style>
format-links:
  - html
  - format: coeos-revealjs
    text: Slides
    target: _blank
other-links:
  - text: PDF
    href: slides.pdf
    target: _blank
    icon: file-pdf
